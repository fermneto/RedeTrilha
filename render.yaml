# Blueprint do Render (render.com/docs/blueprint-spec): só o backend.
# O front vai para a Vercel. Passo a passo em docs/deploy.md.
# NUNCA adicione DEBUG aqui nem no painel: o bypass X-User-Id vira porta aberta.
services:
  - type: web
    name: verso-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      # O SQLite zera a cada restart; o seed (e os consagrados) repovoa no boot.
      - key: SEED_ON_BOOT
        value: "true"
      # A URL da Vercel, sem barra no fim (várias: separadas por vírgula).
      - key: CORS_ORIGINS
        sync: false
      # Opcional: só quando a tradução (que usa a API da Anthropic) estiver na main.
      # - key: ANTHROPIC_API_KEY
      #   sync: false
