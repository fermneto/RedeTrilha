# Blueprint do Render (render.com/docs/blueprint-spec): só o backend.
# O front vai para a Vercel e o banco é o Postgres do Supabase. Passo a passo em docs/deploy.md.
# NUNCA adicione DEBUG aqui nem no painel: o bypass X-User-Id vira porta aberta.
services:
  - type: web
    name: verso-api
    runtime: python
    region: virginia
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      # Connection string do Supabase ("Session pooler", porta 5432).
      - key: DATABASE_URL
        sync: false
      # Popula o banco só no primeiro boot (banco sem usuários); depois, os dados ficam.
      - key: SEED_ON_BOOT
        value: "true"
      # A URL da Vercel, sem barra no fim (várias: separadas por vírgula).
      - key: CORS_ORIGINS
        sync: false
      # Tradução de poemas (API da Anthropic): chave só da demo, com limite de gasto
      # baixo (docs/deploy.md). Sem ela, só a tradução fica fora (503).
      - key: ANTHROPIC_API_KEY
        sync: false
